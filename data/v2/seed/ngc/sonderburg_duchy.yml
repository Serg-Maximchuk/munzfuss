    note:
      de: Rheinischer Goldgulden, kein Dukat. Gekarbt zu Reinfeld 1618-1620, Müntzmeister Tobias Reinhardt. Gewogenes Stück 3,15 g (Kgl. Müntzkabinett Kopenhagen, GP 888, ex Mayntzhusen); zwei 
        Exemplare bekannt.
      en: A Rhenish Goldgulden, not a ducat. Struck at Reinfeld 1618-1620, mintmaster Tobias Reinhardt. Weighed specimen 3.15 g (Royal Coin Cabinet, Copenhagen, GP 888, ex Mayntzhusen); two specimens 
        known.
      uk: Рейнський голдгульден, не дукат. Карбовано в Райнфельді 1618-1620, мінцмейстер Tobias Reinhardt. Зважений екземпляр — 3,15 г (Королівський монетний кабінет, Копенгаген, GP 888, ex 
        Mayntzhusen); відомі два примірники.
    _curation_holds:
      ruler: From Jensen 1971's catalogue; the NGC record leaves it blank.
      mint: "From Jensen 1971's catalogue; the NGC record gives «Mint: N/A»."
      weight_rough_g: "Replaced NGC/NumisMaster's 3.5 g with the WEIGHED specimens. NGC/NumisMaster print 3.5 g / .986 for this type, but that pair is the Krause Schleswig-Holstein volume's blanket gold
        figure, not a measurement of this coin: the same pair sits verbatim on 43 Ducats in the same cache, 13 of that cache's 20 Goldgulden carry no metrology at all, and no entry anywhere in its 476 gold
        records falls in the 3.0-3.35 g Rhenish band. Full evidence: docs/SOURCES.md §13.15. Per §4 verified-wins a source-attested weighing beats a catalogue default, so the 3.5 g is dropped rather than
        carried alongside; §9a list form keeps every specimen."
      weight_rough_verified: true — weighed specimens from Jensen 1971 / Künker.
      fineness: Cleared. The .986 came from the same template as the weight. NO source publishes a fineness for any of these five originals; Jensen 1971 gives one only for Johan Lilliendahl's debased 
        clandestine re-striking of c. 1633 (his own claim 569 ‰, Lübeck's assay 521 ‰) — a forger's figure, not the standard. An honest gap per §0.
      fineness_verified: false — see fineness.
      sources: Added Jensen 1971 / Jensen 2002 / Künker citations; keep across regen.
