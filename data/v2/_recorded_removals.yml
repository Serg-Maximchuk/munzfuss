  # ── an edition year that was never an index ───────────────────────────────
  # KMM prints «Lange 1908, no. 306-312»: 1908 is the catalogue's EDITION year
  # and 306-312 is the index. `_catalog` split its input on `[;,]` before
  # reading it, so «no. 306-312» became a fragment whose prefix named no
  # catalogue and was dropped, leaving the year as the only candidate. Fixed in
  # build_kmk_seed (`_join_edition_year_index`), and the final now carries
  # `lange: 306-312` — the real index. The gate sees only that «1908» left the
  # lange register and cannot tell a replacement from a deletion.
  #
  # Recorded rather than fixed further BECAUSE the replacement is already in
  # place: this is the removal of a value no source ever gave as an index.
  - seed: kmk-266457
    kind: field
    field: lange
    dropped: ['1908']
    reason: >-
      Edition year of Lange's catalogue, read as its index. The source prints
      «Lange 1908, no. 306-312»; the coin now carries lange 306-312.

