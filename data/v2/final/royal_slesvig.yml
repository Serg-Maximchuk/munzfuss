    _curation_holds:
      issuing_entity: Pinned royal_slesvig (curator 2026-08-26, option A). This is Christian III's ROYAL Schleswig issue — Flensburg mint (Reynold Junge mintmaster) + Schleswig-town, the KING's 
        coinage, NOT a Gottorp-share coin (Adolf I's Gottorp share was two years old in 1546). The mint-derived stamp yields [gottorp_duchy, royal_slesvig] because Schleswig-town at 1546 (≥1544) 
        routes to gottorp_duchy; the mint alone cannot disambiguate post-1544 Schleswig-town (royal vs Gottorp), so ruler disambiguates → royal_slesvig. Without this hold the absorb subset-upgrade 
        would re-adopt the joint [gottorp_duchy, royal_slesvig] from the seed_unified bridge.
      year_verified: 1546 is source-attested (Hede 15 = danskmoent c3h15, Numista N#474509, both 1546). A yearless NGC/NumisMaster re-harvest member flips the OR-merge to false; pin true (§4 
        verified-wins). Was commit c070d60; re-pinned after the 2026-08-26 royal_holstein→royal_slesvig relocation dropped the prior foundation and its hold.
